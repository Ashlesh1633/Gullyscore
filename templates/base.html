<!DOCTYPE html>
<html>
<head>
    <title>Cricket Scoring Pro Colorful</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="navbar">
        <div><strong>🏏 Cricket Scoring Pro</strong></div>
        <div>
            <a href="/">Dashboard</a>
            <a href="/teams">Teams</a>
            <a href="/players">Players</a>
            <a href="/matches">Matches</a>
            <a href="/points">Points</a>
            <a href="/player-stats">Player Stats</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
    <footer style="
    text-align: center;
    padding: 20px;
    margin-top: 40px;
    background: linear-gradient(90deg, #4c1d95, #2563eb, #06b6d4);
    color: white;
    font-weight: bold;
    border-radius: 20px 20px 0 0;
">
    🏏 GullyScore | Developed by ASHLESH
</footer>
</body>
</html>
